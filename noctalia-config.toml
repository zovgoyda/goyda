[notification]
layer = "overlay"

[plugins]
enabled = [ "hy4ri/ds4-color", "icefish/phone-connect", "avivbintangaringga/nextboot-selector", "tadomika_ari/w-engine" ]

[shell]
avatar_path = "/home/goyda/SSD/Изображения/the-russian-revolutionary-vladimir-lenin-and-his-cat-1921-v0-0pou9k6bjlqz.jpg"
clipboard_auto_paste = "off"
password_style = "random"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

[templates.sddm]
input_path = "/usr/share/sddm/themes/noctalia/theme.template.conf"
output_path = "/usr/share/sddm/themes/noctalia/theme.conf"

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [
        "pywalfox",
        "pywalfox-beta4",
        "discord",
        "libreoffice",
        "neovim",
        "vscode",
        "steam",
        "fuzzel",
        "hyprtoolkit",
        "yazi"
    ]

[wallpaper]
directory = "/home/goyda/SSD/wallpapers"
transition = []

    [wallpaper.default]
    path = "/home/goyda/SSD/wallpapers/i.webp"

    [wallpaper.last]
    path = "/home/goyda/.local/share/Steam/steamapps/workshop/content/431960/2453328269/preview.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/goyda/.local/share/Steam/steamapps/workshop/content/431960/2453328269/preview.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/goyda/SSD/wallpapers/i.webp"

