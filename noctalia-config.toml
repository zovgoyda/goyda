[audio]
enable_sounds = true
sound_volume = 0.0

[bar.default]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "keyboard_layout",
    "bar",
    "w-engine-widget"
]
start = [ "launcher", "wallpaper", "workspaces", "cpu" ]

